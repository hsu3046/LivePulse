<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>LivePulse · 행사 참가</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body class="participant-body">
  <div class="participant-shell">
    <div id="network-banner" class="network-banner hidden">인터넷 연결이 불안정합니다. 다시 연결하는 중입니다.</div>
    <header class="participant-header">
      <strong id="participant-event-title">행사 정보를 불러오는 중…</strong>
      <span class="status-badge" id="participant-status">연결 중</span>
    </header>
    <main class="participant-main" id="participant-main">
      <div class="participant-state">
        <div>
          <div class="state-icon">···</div>
          <h1>행사에 연결하고 있습니다.</h1>
          <p>잠시만 기다려 주세요.</p>
        </div>
      </div>
    </main>
    <div id="submit-bar" class="submit-bar hidden">
      <button id="submit-answer" class="btn btn-primary btn-large" disabled>답변 제출</button>
    </div>
  </div>

  <script src="/static/app.js"></script>
  <script src="/static/participant.js"></script>
</body>
</html>
