<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LivePulse · 행사 관리</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/host"><span class="brand-mark">L</span><span>LivePulse</span></a>
    <div class="topbar-actions">
      <span id="socket-status" class="connection"><i></i><span>연결 중</span></span>
      <a class="btn btn-secondary btn-small" href="/host">← 행사 목록</a>
    </div>
  </header>

  <main class="manage-shell">
    <section class="card event-hero" id="event-hero">
      <div>
        <div style="display:flex;align-items:center;gap:10px;margin-bottom:6px">
          <span id="event-status" class="status-badge DRAFT"><i class="status-dot"></i>준비 중</span>
          <span id="event-code" style="font-weight:800;color:var(--brand)"></span>
        </div>
        <h1 id="event-title">행사 정보를 불러오는 중입니다…</h1>
        <div class="event-hero-sub">
          <span id="event-description"></span>
          <span id="participant-summary"></span>
        </div>
      </div>
      <div class="event-hero-actions">
        <button class="btn btn-secondary" id="copy-link">참가 링크 복사</button>
        <button class="btn btn-secondary" id="show-qr">QR 보기</button>
        <button class="btn btn-secondary" id="open-presentation">발표 화면 ↗</button>
        <button class="btn btn-primary" id="open-lobby">참가 열기</button>
      </div>
    </section>

    <nav class="tabs" aria-label="행사 관리 메뉴">
      <button class="tab active" data-tab="questions">질문 관리</button>
      <button class="tab" data-tab="live">라이브 진행</button>
    </nav>

    <section id="questions-tab">
      <div class="manage-grid">
        <aside class="card panel">
          <div class="panel-heading">
            <div><h2>질문 목록</h2><small id="question-count" style="color:var(--muted)"></small></div>
            <button class="btn btn-primary btn-small" id="new-question">+ 질문</button>
          </div>
          <div id="question-list" class="question-list"></div>
        </aside>

        <section class="card panel">
          <div class="panel-heading">
            <div>
              <h2 id="editor-title">새 질문</h2>
              <small id="editor-help" style="color:var(--muted)">질문과 선택지를 입력해 주세요.</small>
            </div>
          </div>
          <form id="question-form">
            <div class="field">
              <label for="question-type">질문 유형</label>
              <select class="select" id="question-type">
                <option value="SINGLE">단일 선택</option>
                <option value="RATING">1~5점 평점</option>
              </select>
            </div>
            <div class="field">
              <label for="question-text">질문 *</label>
              <textarea class="textarea" id="question-text" minlength="2" maxlength="200" required placeholder="참가자에게 표시할 질문을 입력하세요."></textarea>
              <span class="hint">최대 200자</span>
            </div>

            <div id="single-fields">
              <div class="field">
                <label for="question-options">선택지 *</label>
                <textarea class="textarea" id="question-options" placeholder="한 줄에 선택지 하나씩 입력하세요.&#10;제품 전략&#10;AI 활용&#10;고객 사례"></textarea>
                <span class="hint">2~10개, 각 80자 이하</span>
              </div>
              <div class="field">
                <label for="chart-type">결과 그래프</label>
                <select class="select" id="chart-type">
                  <option value="BAR">막대그래프</option>
                  <option value="PIE">원그래프</option>
                </select>
              </div>
            </div>

            <div id="rating-fields" class="hidden">
              <div class="inline-fields">
                <div class="field">
                  <label for="min-label">1점 라벨</label>
                  <input class="input" id="min-label" maxlength="40" value="매우 낮음">
                </div>
                <div class="field">
                  <label for="max-label">5점 라벨</label>
                  <input class="input" id="max-label" maxlength="40" value="매우 높음">
                </div>
              </div>
              <div class="option-preview">결과는 1~5점 분포와 평균으로 표시됩니다.</div>
            </div>

            <div class="form-actions">
              <button type="button" class="btn btn-secondary hidden" id="cancel-edit">편집 취소</button>
              <button type="submit" class="btn btn-primary" id="save-question">질문 저장</button>
            </div>
          </form>
        </section>
      </div>
    </section>

    <section id="live-tab" class="hidden">
      <div class="live-grid">
        <aside class="card panel live-question-list">
          <div class="panel-heading">
            <h3>진행 순서</h3>
            <button class="btn btn-secondary btn-small" id="show-waiting">대기 화면</button>
          </div>
          <div id="live-question-list"></div>
        </aside>

        <section class="card panel live-main" id="live-main"></section>

        <aside class="card panel live-stats">
          <div class="panel-heading"><h3>실시간 현황</h3></div>
          <div class="metric-grid">
            <div class="metric"><span>현재 접속</span><strong id="connected-count">0</strong></div>
            <div class="metric"><span>누적 참가</span><strong id="total-count">0</strong></div>
            <div class="metric"><span>현재 응답</span><strong id="response-count">0</strong></div>
          </div>
          <div id="live-stats-content" class="empty-state small">질문을 열면 응답 통계가 표시됩니다.</div>
        </aside>
      </div>
      <div style="display:flex;justify-content:space-between;gap:12px;margin-top:18px;flex-wrap:wrap">
        <a class="btn btn-secondary" id="download-csv" href="#">응답 CSV 다운로드</a>
        <button class="btn btn-danger" id="end-event">행사 종료</button>
      </div>
    </section>
  </main>

  <div id="qr-modal" class="modal-backdrop hidden" role="dialog" aria-modal="true">
    <div class="modal" style="text-align:center">
      <h2 id="qr-title">참가 QR코드</h2>
      <p>참가자는 행사 시작 시 한 번만 스캔하면 됩니다.</p>
      <img id="qr-image" alt="참가 QR코드" style="width:min(320px,100%);border:1px solid var(--line);border-radius:18px">
      <div id="qr-code-text" style="font-size:28px;font-weight:900;letter-spacing:.08em;margin:14px 0"></div>
      <div class="modal-actions">
        <button class="btn btn-secondary" id="close-qr">닫기</button>
        <button class="btn btn-primary" id="qr-present">발표 화면 열기</button>
      </div>
    </div>
  </div>

  <script src="/static/app.js"></script>
  <script src="/static/manage.js"></script>
</body>
</html>
